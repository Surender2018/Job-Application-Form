<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Job Application Form</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="apply_box">
                <h1>Job Application
                    <span class="title_small">(Web-site)</span>
                </h1>
                <form action>
                    <div class="form_container">
                        <div class="form_control">
                            <label for="first_name">First-ame</label>
                            <input name="first_name" id="first_name"
                                placeholder="Enter First Name.">
                        </div>
                        <div class="form_control">
                            <label for="last_name">Last-ame</label>
                            <input name="last_name" id="last_name"
                                placeholder="Enter Last Name.">
                        </div>
                        <div class="form_control">
                            <label for="email">Email</label>
                            <input type="email" name="email" id="email"
                                placeholder="Enter Email.">
                        </div>
                        <div class="form_control">
                            <label for="job_role">Job-role</label>
                            <select name="job_role" id="job_role">
                                <option value>Select Job Role</option>
                                <option value="frontend">Frontend
                                    Developer</option>
                                <option value="backend">Backend
                                    Developer</option>
                                <option value="full_stack">Full Stack
                                    Developer</option>
                                <option value="ui_ux">Ui Ux Designer</option>
                            </select>
                        </div>
                        <div class="textarea_control">
                            <label for="address">Address</label>
                            <textarea name="address" id="address" rows="4" cols="50" placeholder="Enter Your Address">Address</textarea>
                        </div>
                        <div class="form_control">
                            <label for="city">City</label>
                            <input name="city" id="city"
                                placeholder="Enter City Name.">
                        </div>
                        <div class="form_control">
                            <label for="pincode">Pin-Code</label>
                            <input type="number" name="pincode" id="pincode"
                                placeholder="Enter Pincode.">
                        </div>
                        <div class="form_control">
                            <label for="date">Date</label>
                            <input value="2026-01-17" type="date" name="date"
                                id="date">
                        </div>
                        <div class="form_control">
                            <label for="upload">Upload Your CV</label>
                            <input type="file" name="upload" id="upload">
                        </div>
                    </div>
                    <div class="button_container">
                        <button type="submit">Apply-Now</button>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
